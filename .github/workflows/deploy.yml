name: Deploy to GitHub Pages

on:
  # デフォルトブランチへの push で公開。手動実行も可。
  push:
    branches: [main]
  workflow_dispatch:

# gh-pages ブランチへ push するため contents:write が必要
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Build
        env:
          # リポジトリ名のサブパスに配信するため base を指定
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # Pages は「ブランチ配信（gh-pages）」で有効化済み。
      # ビルド成果物を gh-pages ブランチへ push して更新する。
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${{ github.sha }}"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            gh-pages:gh-pages
